name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and use preinstalled Android SDK
        run: |
          # 1. 查找 sdkmanager 的绝对路径
          SDKMANAGER_PATH=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER_PATH=$SDKMANAGER_PATH" >> $GITHUB_ENV

          # 2. 使用完整路径接受许可协议
          yes | $SDKMANAGER_PATH --licenses > /dev/null

          # 3. 使用完整路径安装构建组件
          $SDKMANAGER_PATH "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qimen-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
