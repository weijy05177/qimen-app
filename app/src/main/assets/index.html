<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拼音训练</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #111; color: #eee; overflow: hidden; user-select: none;
}
.page { position: absolute; inset: 0; display: none; flex-direction: column; }
.page.active { display: flex; }

/* 配置页 */
#page-config { padding: 12px; overflow-y: auto; }
#page-config h1 { font-size: 15px; margin: 0 0 10px; text-align: center; color: #aaa; font-weight: normal; }
.group { background: #1a1a1a; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.group h2 { font-size: 14px; margin: 0 0 8px; color: #7ec8e3; font-weight: normal; }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.chk-item {
  display: flex; align-items: center; justify-content: center;
  background: #222; border: 1px solid #333; border-radius: 8px;
  padding: 10px 4px; font-size: 15px; color: #666;
  transition: background .1s, color .1s, border-color .1s;
}
.chk-item.on { background: #2d5a8e; color: #fff; border-color: #2d7ef7; }
.btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
button {
  flex: 1; padding: 12px; border: none; border-radius: 10px;
  background: #333; color: #eee; font-size: 15px; font-weight: bold;
}
button.primary { background: #2d7ef7; color: #fff; }
button.danger { background: #6b2020; color: #eee; }
button:active { opacity: 0.7; }

/* 训练页 */
#page-train { padding: 8px; }
#display-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 0;
}
#display-text { font-weight: bold; color: #fff; text-align: center; line-height: 1; }
.mode-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.mode-btn {
  flex: 1; min-width: 70px; padding: 8px 4px; border-radius: 8px;
  background: #222; color: #888; font-size: 12px; text-align: center;
  border: 1px solid #333;
}
.mode-btn.on { background: #2d5a8e; color: #fff; border-color: #2d7ef7; }

/* 拼音子选项：单拼 / 双拼 */
.sub-row { display: flex; gap: 6px; margin-bottom: 6px; }
.sub-btn {
  flex: 1; padding: 8px; border-radius: 8px;
  background: #222; color: #666; border: 1px solid #333;
  font-size: 13px; text-align: center;
}
.sub-btn.on { background: #1f6b3a; color: #fff; border-color: #2eb85c; }

.tone-row { display: flex; gap: 6px; margin-bottom: 6px; }
.tone-btn {
  flex: 1; padding: 8px; border-radius: 8px;
  background: #222; color: #666; border: 1px solid #333;
  font-size: 13px; text-align: center;
}
.tone-btn.on { background: #2d5a8e; color: #fff; border-color: #2d7ef7; }
.tone-row.disabled .tone-btn { opacity: 0.35; pointer-events: none; }
.ctrl-row { display: flex; gap: 8px; }
</style>
</head>
<body>

<!-- 配置页 -->
<div class="page active" id="page-config">
  <h1>选择要练习的拼音（勾选后点击“开始训练”）</h1>
  <div class="group">
    <h2>声母</h2>
    <div class="chk-grid" id="sm-grid"></div>
  </div>
  <div class="group">
    <h2>韵母</h2>
    <div class="chk-grid" id="ym-grid"></div>
  </div>
  <div class="btn-row">
    <button id="btn-all">全部选中</button>
    <button id="btn-none">全部取消</button>
  </div>
  <div class="btn-row">
    <button class="primary" id="btn-start">开始训练</button>
  </div>
  <div class="btn-row">
    <button class="danger" id="btn-exit">退出应用</button>
  </div>
</div>

<!-- 训练页 -->
<div class="page" id="page-train">
  <div id="display-area"><div id="display-text"></div></div>
  <div class="mode-row" id="mode-row"></div>
  <!-- 拼音子选项：只在“拼音混合”模式下显示 -->
  <div class="sub-row" id="pinyin-options" style="display:none;">
    <div class="sub-btn on" data-opt="single">单拼</div>
    <div class="sub-btn on" data-opt="double">双拼</div>
  </div>
  <div class="tone-row" id="tone-row">
    <div class="tone-btn" data-tone="0">一声 ˉ</div>
    <div class="tone-btn" data-tone="1">二声 ˊ</div>
    <div class="tone-btn" data-tone="2">三声 ˇ</div>
    <div class="tone-btn" data-tone="3">四声 ˋ</div>
  </div>
  <div class="ctrl-row">
    <button id="btn-next">下一个</button>
    <button id="btn-back">返回配置</button>
  </div>
</div>

<script>
// ============ 数据 ============
const SHENGMU = ["b","p","m","f","d","t","n","l","g","k","h","j","q","x","zh","ch","sh","r","z","c","s","y","w"];

const YUNMU_TONES = {
  "a": ["ā","á","ǎ","à"],
  "o": ["ō","ó","ǒ","ò"],
  "e": ["ē","é","ě","è"],
  "i": ["ī","í","ǐ","ì"],
  "u": ["ū","ú","ǔ","ù"],
  "ü": ["ǖ","ǘ","ǚ","ǜ"],
  "ai": ["āi","ái","ǎi","ài"],
  "ei": ["ēi","éi","ěi","èi"],
  "ui": ["uī","uí","uǐ","uì"],
  "ao": ["āo","áo","ǎo","ào"],
  "ou": ["ōu","óu","ǒu","òu"],
  "iu": ["iū","iú","iǔ","iù"],
  "ie": ["iē","ié","iě","iè"],
  "üe": ["üē","üé","üě","üè"],
  "er": ["ēr","ér","ěr","èr"],
  "an": ["ān","án","ǎn","àn"],
  "en": ["ēn","én","ěn","èn"],
  "in": ["īn","ín","ǐn","ìn"],
  "un": ["ūn","ún","ǔn","ùn"],
  "ün": ["ǖn","ǘn","ǚn","ǜn"],
  "ang": ["āng","áng","ǎng","àng"],
  "eng": ["ēng","éng","ěng","èng"],
  "ing": ["īng","íng","ǐng","ìng"],
  "ong": ["ōng","óng","ǒng","òng"],
};

const VALID_RAW = `
ba bo bi bu bai bei bao ban ben bang beng bian biao bie bin bing
pa po pi pu pai pei pao pou pan pen pang peng pian piao pie pin ping
ma mo me mi mu mai mei mao mou man men mang meng mian miao mie miu min ming
fa fo fu fei fou fan fen fang feng
da de di du dai dei dao dou dan den dang deng dong die diu dian ding duan dui dun
ta te ti tu tai tao tou tan tang teng tong tie tian ting tuan tui tun
na ne ni nu nü nai nei nao nou nan nen nang neng nong nie niu nian nin niang ning nuan nüe nuo nun
la le li lu lü lai lei lao lou lan lang leng long lie liu lian lin liang ling luan lüe luo lun
ga ge gu gai gei gao gou gan gen gang geng gong gua guo guai gui guan gun guang
ka ke ku kai kei kao kou kan ken kang keng kong kua kuo kuai kui kuan kun kuang
ha he hu hai hei hao hou han hen hang heng hong hua huo huai hui huan hun huang
ji ju jia jie jiu jiao jian jin jiang jing jiong jue juan jun
qi qu qia qie qiu qiao qian qin qiang qing qiong que quan qun
xi xu xia xie xiu xiao xian xin xiang xing xiong xue xuan xun
zha zhe zhi zhu zhai zhei zhao zhou zhan zhen zhang zheng zhong zhua zhuo zhuai zhui zhuan zhun zhuang
cha che chi chu chai chao chou chan chen chang cheng chong chua chuo chuai chui chuan chun chuang
sha she shi shu shai shei shao shou shan shen shang sheng shua shuo shuai shui shuan shun shuang
re ri ru rao rou ran ren rang reng rong rua ruo rui ruan run
za ze zi zu zai zei zao zou zan zen zang zeng zong zuo zui zuan zun
ca ce ci cu cai cao cou can cen cang ceng cong cuo cui cuan cun
sa se si su sai sao sou san sen sang seng song suo sui suan sun
ya ye yi yo yu yao you yan yin yang ying yong yue yuan yun
wa wo wu wai wei wan wen wang weng
`;
const VALID_SYLLABLES = new Set(VALID_RAW.trim().split(/\s+/));

const TONE_TO_BASE = {
  "ā":"a","á":"a","ǎ":"a","à":"a",
  "ō":"o","ó":"o","ǒ":"o","ò":"o",
  "ē":"e","é":"e","ě":"e","è":"e",
  "ī":"i","í":"i","ǐ":"i","ì":"i",
  "ū":"u","ú":"u","ǔ":"u","ù":"u",
  "ǖ":"ü","ǘ":"ü","ǚ":"ü","ǜ":"ü"
};
const UMLAUT_TO_U = { "ü":"u","ǖ":"ū","ǘ":"ú","ǚ":"ǔ","ǜ":"ù" };
const UMLAUT_SONORANTS = new Set(["j","q","x","y"]);

// 元音字母集合（含带声调形式）
const VOWEL_CHARS = new Set([
  "a","o","e","i","u","ü",
  "ā","á","ǎ","à",
  "ō","ó","ǒ","ò",
  "ē","é","ě","è",
  "ī","í","ǐ","ì",
  "ū","ú","ǔ","ù",
  "ǖ","ǘ","ǚ","ǜ"
]);

function removeTone(text) {
  return [...text].map(c => TONE_TO_BASE[c] || c).join("");
}
function isValidSyllable(sm, ymTone) {
  let base = removeTone(ymTone);
  if (UMLAUT_SONORANTS.has(sm) && base.startsWith("ü")) base = "u" + base.slice(1);
  return VALID_SYLLABLES.has(sm + base);
}
function applySpelling(sm, ymTone) {
  if (UMLAUT_SONORANTS.has(sm) && UMLAUT_TO_U[ymTone[0]]) {
    return sm + UMLAUT_TO_U[ymTone[0]] + ymTone.slice(1);
  }
  return sm + ymTone;
}
// 数一个拼音里元音字母的个数
function countVowels(str) {
  let n = 0;
  for (const ch of str) if (VOWEL_CHARS.has(ch)) n++;
  return n;
}

// ============ 状态 ============
const state = {
  mode: "shengmu",
  selectedSM: new Set(SHENGMU),
  selectedYM: new Set(Object.keys(YUNMU_TONES)),
  tones: [true, true, true, true],
  pinyinSingle: true,   // 单拼
  pinyinDouble: true,   // 双拼
  pool: [],
  queue: [],
  current: "",
};

const MODE_NAMES = {
  shengmu: "声母训练",
  yunmu: "韵母训练",
  yunmu_tone: "韵母按声调",
  pinyin: "拼音混合"
};

// ============ 配置页：复选框 ============
const smGrid = document.getElementById("sm-grid");
SHENGMU.forEach(sm => {
  const el = document.createElement("div");
  el.className = "chk-item on";
  el.textContent = sm;
  el.onclick = () => {
    if (state.selectedSM.has(sm)) { state.selectedSM.delete(sm); el.classList.remove("on"); }
    else { state.selectedSM.add(sm); el.classList.add("on"); }
  };
  smGrid.appendChild(el);
});

const ymGrid = document.getElementById("ym-grid");
Object.keys(YUNMU_TONES).forEach(ym => {
  const el = document.createElement("div");
  el.className = "chk-item on";
  el.textContent = ym;
  el.onclick = () => {
    if (state.selectedYM.has(ym)) { state.selectedYM.delete(ym); el.classList.remove("on"); }
    else { state.selectedYM.add(ym); el.classList.add("on"); }
  };
  ymGrid.appendChild(el);
});

// ============ 训练页：模式按钮 ============
const modeRow = document.getElementById("mode-row");
Object.entries(MODE_NAMES).forEach(([k, name]) => {
  const el = document.createElement("div");
  el.className = "mode-btn" + (k === "shengmu" ? " on" : "");
  el.dataset.value = k;
  el.textContent = name;
  el.onclick = () => switchMode(k);
  modeRow.appendChild(el);
});

// ============ 训练页：单拼 / 双拼 子选项 ============
document.querySelectorAll("#pinyin-options .sub-btn").forEach(el => {
  el.onclick = () => {
    const opt = el.dataset.opt;
    if (opt === "single") {
      state.pinyinSingle = !state.pinyinSingle;
      el.classList.toggle("on", state.pinyinSingle);
    } else {
      state.pinyinDouble = !state.pinyinDouble;
      el.classList.toggle("on", state.pinyinDouble);
    }
    if (state.mode === "pinyin") rebuildPool();
  };
});

// ============ 训练页：声调按钮 ============
const toneRow = document.getElementById("tone-row");
document.querySelectorAll(".tone-btn").forEach(el => {
  el.classList.add("on");
  el.onclick = () => {
    const i = parseInt(el.dataset.tone);
    state.tones[i] = !state.tones[i];
    el.classList.toggle("on", state.tones[i]);
    if (state.mode === "yunmu_tone") rebuildPool();
  };
});

// ============ 逻辑 ============
function buildPoolForMode(mode) {
  const sms = [...state.selectedSM];
  const yms = [...state.selectedYM];
  if (mode === "shengmu") return [...sms];
  if (mode === "yunmu") {
    const out = [];
    yms.forEach(ym => out.push(...YUNMU_TONES[ym]));
    return out;
  }
  if (mode === "yunmu_tone") {
    const idx = state.tones.map((v,i)=>v?i:-1).filter(i=>i>=0);
    if (!idx.length) return [];
    const out = [];
    yms.forEach(ym => idx.forEach(i => out.push(YUNMU_TONES[ym][i])));
    return out;
  }
  if (mode === "pinyin") {
    const out = [];
    sms.forEach(sm => {
      yms.forEach(ym => {
        YUNMU_TONES[ym].forEach(t => {
          if (!isValidSyllable(sm, t)) return;
          const result = applySpelling(sm, t);
          const vc = countVowels(result);
          // 单拼：只有 1 个元音字母
          if (vc === 1 && !state.pinyinSingle) return;
          // 双拼：有 2 个或更多元音字母
          if (vc >= 2 && !state.pinyinDouble) return;
          out.push(result);
        });
      });
    });
    return out;
  }
  return [];
}

function refillQueue() {
  state.queue = [...state.pool];
  for (let i = state.queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.queue[i], state.queue[j]] = [state.queue[j], state.queue[i]];
  }
}

function nextChar() {
  if (!state.queue.length) refillQueue();
  if (!state.queue.length) return;
  state.current = state.queue.pop();
  document.getElementById("display-text").textContent = state.current;
  adjustFont();
}

function adjustFont() {
  const el = document.getElementById("display-text");
  const area = document.getElementById("display-area");
  const w = area.clientWidth, h = area.clientHeight;
  if (!w || !h) return;
  let best = 20, lo = 20, hi = Math.min(w, h);
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    el.style.fontSize = mid + "px";
    const r = el.getBoundingClientRect();
    if (r.width <= w * 0.85 && r.height <= h * 0.85) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  el.style.fontSize = best + "px";
}

function rebuildPool() {
  state.pool = buildPoolForMode(state.mode);
  if (!state.pool.length) {
    alert("当前配置下没有可用的拼音，请检查勾选或子选项。");
    return false;
  }
  refillQueue();
  nextChar();
  return true;
}

function switchMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".mode-btn").forEach(el => {
    el.classList.toggle("on", el.dataset.value === mode);
  });
  toneRow.classList.toggle("disabled", mode !== "yunmu_tone");
  // 只在“拼音混合”模式下显示 单拼/双拼
  document.getElementById("pinyin-options").style.display =
    (mode === "pinyin") ? "flex" : "none";
  rebuildPool();
}

function showPage(name) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  if (name === "train") setTimeout(adjustFont, 60);
}

// ============ 配置页按钮 ============
document.getElementById("btn-all").onclick = () => {
  document.querySelectorAll("#sm-grid .chk-item, #ym-grid .chk-item").forEach(el => el.classList.add("on"));
  state.selectedSM = new Set(SHENGMU);
  state.selectedYM = new Set(Object.keys(YUNMU_TONES));
};
document.getElementById("btn-none").onclick = () => {
  document.querySelectorAll("#sm-grid .chk-item, #ym-grid .chk-item").forEach(el => el.classList.remove("on"));
  state.selectedSM.clear();
  state.selectedYM.clear();
};
document.getElementById("btn-start").onclick = () => {
  if (!state.selectedSM.size && !state.selectedYM.size) {
    alert("请至少选择一个声母或韵母。");
    return;
  }
  if (!rebuildPool()) return;
  showPage("train");
};
document.getElementById("btn-exit").onclick = () => {
  if (window.Android && window.Android.exit) window.Android.exit();
  else if (confirm("确定要退出吗？")) window.close();
};

// ============ 训练页按钮 ============
document.getElementById("display-area").onclick = nextChar;
document.getElementById("btn-next").onclick = nextChar;
document.getElementById("btn-back").onclick = () => showPage("config");

// ============ 自适应 ============
window.addEventListener("resize", adjustFont);
window.addEventListener("orientationchange", () => setTimeout(adjustFont, 120));
</script>
</body>
</html>
